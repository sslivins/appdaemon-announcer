announcer:
  module: announcer
  class: Announcer
  log: announcer_log

  # ======================================================================
  # Where announcements play
  # ======================================================================
  # Default target speaker(s). Individual events (and announcer.say calls) can
  # override this with their own `speakers:` list.
  speakers:
    - media_player.dining_room
  # Snapshot/duck/restore the whole Sonos group the speaker is bonded to (this
  # is what the old HA automation did with `with_group: true`).
  duck_with_group: true

  # ======================================================================
  # Ducking strategy
  # ======================================================================
  # overlay  (recommended, Sonos-only): plays the chime + voice as native Sonos
  #          "audio clips". The music KEEPS PLAYING and is automatically ducked
  #          under the announcement, then restored -- no snapshot, no volume
  #          juggling, no waiting. Fast and glitch-free.
  # snapshot (legacy, any media_player): snapshot -> lower volume -> play (this
  #          STOPS the music) -> wait for playback to finish -> restore. Use
  #          only for non-Sonos speakers.
  duck_mode: overlay

  # ======================================================================
  # Volume + timing
  # ======================================================================
  # Announcement (clip) volume, 0-1. In overlay mode this is the chime/voice
  # clip volume; the music's own volume is left untouched.
  announce_volume: 0.5
  # overlay mode: fixed gap between the chime clip and the voice clip so the
  # voice doesn't step on the chime (the chime length is known, so this is
  # deterministic spacing -- NOT a guess at speech length).
  overlay_gap_seconds: 1.6
  # --- snapshot-mode-only safety caps (ignored in overlay mode) ---------
  start_timeout: 15      # max seconds to wait for playback to *begin*
  announce_timeout: 45   # hard cap on a single spoken message
  settle_seconds: 0.4    # brief pause before restore so Sonos settles
  duck_settle_seconds: 0.7  # MAX wait for an async volume_set to be confirmed
                            # by HA before proceeding (poll, continue as soon as
                            # the new level is reported).

  # ======================================================================
  # Chime (played BEFORE the spoken text)
  # ======================================================================
  # `media_url` can be a Home Assistant media-source id (resolved by HA for the
  # Sonos), a same-LAN HA `/local/...` URL, or any public https URL.
  # The bundled chime.wav was uploaded to HA local media
  # (Settings > Media) and is referenced by its media-source id below.
  chime:
    enabled: true
    media_url: "media-source://media_source/local/chime.wav"
    media_content_type: music
    # volume: 0.5          # optional; snapshot mode only
    timeout: 10            # snapshot mode only: max wait for the chime

  # ======================================================================
  # Text-to-speech
  # ======================================================================
  tts:
    engine: tts.home_assistant_cloud
    cache: true
    # Voice for the HA Cloud engine (Azure neural voices). AvaNeural is a clear,
    # natural female voice. Browse others in HA: Developer Tools > Actions >
    # tts.speak, or query tts/engine/voices. Omit to use the engine default.
    voice: AvaNeural
    # language: en-US      # optional; defaults to the engine's default

  # ======================================================================
  # Quiet hours
  # ======================================================================
  # mode: silent  -> skip the announcement entirely
  # mode: quieter -> still play, but at `quiet_volume` (and skip the chime if
  #                  skip_chime is true)
  # Window may wrap past midnight (e.g. 21:30 -> 07:30). An individual event or
  # announcer.say call can set `ignore_quiet_hours: true` to always play.
  quiet_hours:
    start: "21:30"
    end: "07:30"
    mode: quieter
    quiet_volume: 0.2
    skip_chime: true

  # ======================================================================
  # Generic event API
  # ======================================================================
  # Any app/automation can fire this event to request a ducked announcement:
  #   event_type: announcer.say
  #   event_data:
  #     message: "Dinner is ready"
  #     speakers: [media_player.kitchen]   # optional
  #     volume: 0.6                        # optional
  #     chime: false                       # optional
  #     ignore_quiet_hours: true           # optional
  say_event: announcer.say

  # ======================================================================
  # Events -- add as many trigger->message mappings as you like
  # ======================================================================
  events:
    - name: laundry_complete
      # GE Profile combo washer/dryers -- a single "Finished" per full cycle.
      trigger:
        entity_id:
          - sensor.zv367575n_laundry_machine_state
          - sensor.zv367668n_laundry_machine_state
        to: "Finished"
      message: "The laundry cycle has completed"
      # Optional per-event overrides:
      # speakers: [media_player.kitchen]
      # volume: 0.6
      # chime: false
      # ignore_quiet_hours: true
